<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试试你的运气 | 幸运大抽奖</title>
    <style>
        body {
            background-color: #1E4198;
            margin: 0;
            padding: 10px; /* 缩小内边距 */
            font-family: Arial, sans-serif;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* 新增语言切换按钮样式 */
        .language-switcher {
            position: absolute;
            top: 10px; /* 缩小顶部间距 */
            right: 10px; /* 缩小右侧间距 */
            z-index: 100;
        }
        .lang-btn {
            background-color: #FFC100;
            color: #000;
            border: none;
            padding: 6px 12px; /* 缩小按钮内边距 */
            border-radius: 4px; /* 缩小圆角 */
            margin-left: 4px; /* 缩小按钮间距 */
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-family: Arial, "Times New Roman", serif;
            font-size: 12px; /* 缩小字体 */
        }
        .lang-btn:hover {
            background-color: #FFD700;
            transform: scale(1.05);
        }
        .lang-btn.active {
            background-color: #E62E2E;
            color: #FFD900;
        }
        .header {
            text-align: center;
            margin-bottom: 15px; /* 缩小底部间距 */
            padding-top: 30px; /* 缩小顶部内边距 */
        }
        .title {
            background-color: #E62E2E;
            color: #FFD900;
            font-size: 20px; /* 缩小标题字体 */
            font-weight: bold;
            padding: 8px 20px; /* 缩小内边距 */
            border-radius: 4px; /* 缩小圆角 */
            display: inline-block;
            margin: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 90px); /* 缩小格子宽度 */
            grid-template-rows: repeat(7, 50px); /* 缩小格子高度 */
            gap: 8px; /* 缩小格子间距 */
            justify-content: center;
        }
        .grid-item {
            background-color: #E62E2E;
            color: #FFD900;
            font-size: 22px; /* 缩小问号字体 */
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px; /* 缩小圆角 */
            position: relative;
            padding: 3px 0; /* 缩小内边距 */
            cursor: default;
            transition: all 0.15s ease;
            box-sizing: border-box;
            text-align: center;
        }
        .empty {
            background-color: transparent;
        }
        /* 新增图片容器样式 */
        .image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保持图片比例并覆盖容器 */
        }
        .start-btn {
            background-color: #FFC100;
            color: #000;
            font-size: 18px; /* 缩小按钮字体 */
            font-weight: bold;
            padding: 8px 70px; /* 缩小按钮内边距 */
            border: none;
            border-radius: 4px; /* 缩小圆角 */
            margin-top: 15px; /* 缩小顶部间距 */
            cursor: pointer;
            transition: all 0.2s;
        }
        .start-btn:disabled {
            background-color: #999;
            color: #666;
            cursor: not-allowed;
            transform: scale(1);
        }
        .start-btn:hover:not(:disabled) {
            background-color: #FFD700;
            transform: scale(1.02);
        }
        .btn-container {
            text-align: center;
        }
        .icon {
            width: 15px; /* 缩小装饰图标 */
            height: 15px; /* 缩小装饰图标 */
            background-color: #FFC100;
            border-radius: 50% 50% 50% 0;
            position: absolute;
        }
        .icon-left { top: 120px; left: 10px; } /* 调整装饰图标位置 */
        .icon-right { top: 200px; right: 10px; } /* 调整装饰图标位置 */
        .star {
            color: #fff;
            position: absolute;
            font-size: 14px; /* 缩小星星字体 */
        }
        .star1 { top: 60px; left: 10px; } /* 调整星星位置 */
        .star2 { bottom: 40px; right: 10px; } /* 调整星星位置 */
        .star3 { bottom: 15px; left: 10px; } /* 调整星星位置 */
        .star4 { right: 10px; top: 300px; } /* 调整星星位置 */
        /* 滚动高亮样式 */
        .grid-item.active {
            background-color: #FFD900;
            color: #E62E2E;
            transform: scale(1.05);
            box-shadow: 0 0 12px #FFD900; /* 缩小阴影 */
            z-index: 10;
        }
        /* 中奖高亮+闪烁样式（滚动停止后） */
        .grid-item.win {
            background-color: #FF0000;
            color: #FFFFFF;
            box-shadow: 0 0 15px #FF0000, 0 0 25px #FF0000; /* 缩小阴影 */
            transform: scale(1.05);
            z-index: 20;
        }
        /* 翻转后白底 + 无限持续闪烁 */
        .grid-item.flipped {
            background-color: #FFFFFF !important;
            font-weight: bold;
            border-radius: 4px; /* 缩小圆角 */
            transform: scale(1);
            z-index: 25;
            animation: flipFlash 1.2s ease-in-out infinite alternate;
        }
        /* 不同奖品的文字颜色 */
        .color-black { color: #000000 !important; }
        .color-yellow { color: #FFD900 !important; }
        .color-orange { color: #FF7F00 !important; }
        .color-blue { color: #0066FF !important; }
        .color-red { color: #E62E2E !important; }
        /* 洗牌展示奖品样式（无无限闪烁） */
        .grid-item.shuffle-show {
            background-color: #FFFFFF;
            font-weight: bold;
            border-radius: 4px; /* 缩小圆角 */
            transform: scale(1);
            z-index: 25;
        }
        /* 滚动中奖闪烁动画 */
        @keyframes flashOnce {
            from { opacity: 1; transform: scale(1.05); }
            to { opacity: 0.5; transform: scale(1.12); }
        }
        /* 翻转后永久持续闪烁动画 */
        @keyframes flipFlash {
            from { box-shadow: 0 0 8px #FFFFFF, 0 0 12px #E62E2E; opacity: 1; }
            to { box-shadow: 0 0 20px #FFFFFF, 0 0 30px #E62E2E; opacity: 0.95; }
        }
        /* 中奖文字分行样式 */
        .prize-text {
            font-size: 13px; /* 缩小奖品文字 */
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px; /* 缩小行间距 */
            width: 100%;
            padding: 0 3px; /* 缩小内边距 */
        }
        .prize-top { font-size: 12px; /* 缩小上半部分文字 */ }
        .prize-bottom { font-size: 14px; /* 缩小下半部分文字 */ font-weight: bold; }
    </style>
</head>
<body>
    <!-- 新增语言切换按钮 -->
    <div class="language-switcher">
        <button class="lang-btn active" id="cnBtn">中文</button>
        <button class="lang-btn" id="enBtn">English</button>
        <button class="lang-btn" id="arBtn">العربية</button>
    </div>
    
    <div class="icon icon-left"></div>
    <div class="icon icon-right"></div>
    <div class="star star1">★</div>
    <div class="star star2">★</div>
    <div class="star star3">★</div>
    <div class="star star4">★</div>
    
    <div class="header">
        <div class="title" id="mainTitle">试试你的运气</div>
    </div>

    <div class="grid-container">
        <div class="grid-item" data-num="1">？</div>
        <div class="grid-item" data-num="2">？</div>
        <div class="grid-item" data-num="3">？</div>
        <div class="grid-item" data-num="4">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="5">？</div>
        <div class="grid-item" data-num="6">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="7">？</div>
        <div class="grid-item" data-num="8">？</div>
        <!-- 插入图片的位置 -->
        <div class="image-container">
            <img src="photo/a1.png" alt="装饰图片">
        </div>
        <div class="grid-item" data-num="9">？</div>
        <div class="grid-item" data-num="10">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="11">？</div>
        <div class="grid-item" data-num="12">？</div>
        <div class="empty"></div>
        <div class="grid-item" data-num="13">？</div>
        <div class="grid-item" data-num="14">？</div>
        <div class="grid-item" data-num="15">？</div>
        <div class="grid-item" data-num="16">？</div>
    </div>

    <div class="btn-container">
        <button class="start-btn" id="startBtn">开始</button>
    </div>

    <script>
        // ========== 语言配置 ==========
        const langConfig = {
            cn: {
                title: "试试你的运气",
                startBtn: "开始",
                shuffleBtn: "洗牌",
                prize100: "获得100粉丝",
                prize1000: "获得1000粉丝",
                prize5000: "获得5000粉丝",
                prize10000: "获得10000粉丝",
                prize100000: "获得100000粉丝",
                prizeTop: "获得",
                prize100Bottom: "100粉丝",
                prize1000Bottom: "1000粉丝",
                prize5000Bottom: "5000粉丝",
                prize10000Bottom: "10000粉丝",
                prize100000Bottom: "100000粉丝",
                unknown: "？",
                clearRecordAlert: "✅ 中奖记录功能已移除！",
                checkProbabilityAlert: "概率验证完成！请查看控制台日志（按F12打开）",
                checkProbabilityLog1: "概率验证结果（共",
                checkProbabilityLog2: "次）：",
                checkProbabilityLog3: "粉丝：",
                checkProbabilityLog4: "次 ("
            },
            en: {
                title: "Try Your Luck",
                startBtn: "Start",
                shuffleBtn: "Shuffle",
                prize100: "Win 100 Fans",
                prize1000: "Win 1000 Fans",
                prize5000: "Win 5000 Fans",
                prize10000: "Win 10000 Fans",
                prize100000: "Win 100000 Fans",
                prizeTop: "Win",
                prize100Bottom: "100 Fans",
                prize1000Bottom: "1000 Fans",
                prize5000Bottom: "5000 Fans",
                prize10000Bottom: "10000 Fans",
                prize100000Bottom: "100000 Fans",
                unknown: "?",
                clearRecordAlert: "✅ Winning record function has been removed!",
                checkProbabilityAlert: "Probability verification completed! Please check console log (press F12 to open)",
                checkProbabilityLog1: "Probability verification result (total ",
                checkProbabilityLog2: " times):",
                checkProbabilityLog3: " Fans: ",
                checkProbabilityLog4: " times ("
            },
            ar: {
                title: "جرب حظك",
                startBtn: "ابدأ",
                shuffleBtn: "خلط",
                prize100: "فوز 100 متابع",
                prize1000: "فوز 1000 متابع",
                prize5000: "فوز 5000 متابع",
                prize10000: "فوز 10000 متابع",
                prize100000: "فوز 100000 متابع",
                prizeTop: "الفوز",
                prize100Bottom: "100 متابع",
                prize1000Bottom: "1000 متابع",
                prize5000Bottom: "5000 متابع",
                prize10000Bottom: "10000 متابع",
                prize100000Bottom: "100000 متابع",
                unknown: "؟",
                clearRecordAlert: "✅ تم إزالة وظيفة سجل الفوز!",
                checkProbabilityAlert: "تم إكمال التحقق من الاحتمالية! يرجى التحقق من سجل وحدة التحكم (اضغط F12 لفتحه)",
                checkProbabilityLog1: "نتيجة التحقق من الاحتمالية (مجموع ",
                checkProbabilityLog2: " مرة):",
                checkProbabilityLog3: " متابع: ",
                checkProbabilityLog4: " مرة ("
            }
        };
        
        // 当前语言
        let currentLang = "cn";
        
        // ========== 核心配置项 ==========
        const luckyPath = [1,2,3,5,7,9,11,13,16,15,14,12,10,8,6,4,1]; // 滚动轨迹
        const startBtn = document.getElementById('startBtn');
        const mainTitle = document.getElementById('mainTitle');
        const cnBtn = document.getElementById('cnBtn');
        const enBtn = document.getElementById('enBtn');
        const arBtn = document.getElementById('arBtn');
        let isRunning = false; // 抽奖状态锁
        let isShuffleMode = false; // 是否为洗牌模式
        const FLASH_TIMES = 5; // 滚动中奖闪烁次数
        const FLASH_INTERVAL = 180; // 闪烁间隔(ms)
        const SHOW_PRIZE_TIME = 2000; // 洗牌展示奖品时长(ms)
        
        // 奖品概率配置（精确控制）
        const PRIZE_PROBABILITY = {
            "获得100粉丝": 80,    // 80%
            "获得1000粉丝": 12,   // 12%
            "获得5000粉丝": 6,    // 6%
            "获得10000粉丝": 2,   // 2%
            "获得100000粉丝": 0   // 0%
        };
        
        // 奖品基础配置（仅用于洗牌展示）
        const prizeConfig = [
            "获得100粉丝", "获得100粉丝", "获得100粉丝", "获得100粉丝", "获得100粉丝",
            "获得100粉丝", "获得100粉丝",
            "获得1000粉丝", "获得1000粉丝", "获得1000粉丝", "获得1000粉丝",
            "获得5000粉丝", "获得5000粉丝",
            "获得10000粉丝", "获得10000粉丝",
            "获得100000粉丝"
        ];
        
        // 奖品名称映射
        const prizeMap = {
            cn: {
                "获得100粉丝": "获得100粉丝",
                "获得1000粉丝": "获得1000粉丝",
                "获得5000粉丝": "获得5000粉丝",
                "获得10000粉丝": "获得10000粉丝",
                "获得100000粉丝": "获得100000粉丝"
            },
            en: {
                "获得100粉丝": "Win 100 Fans",
                "获得1000粉丝": "Win 1000 Fans",
                "获得5000粉丝": "Win 5000 Fans",
                "获得10000粉丝": "Win 10000 Fans",
                "获得100000粉丝": "Win 100000 Fans"
            },
            ar: {
                "获得100粉丝": "فوز 100 متابع",
                "获得1000粉丝": "فوز 1000 متابع",
                "获得5000粉丝": "فوز 5000 متابع",
                "获得10000粉丝": "فوز 10000 متابع",
                "获得100000粉丝": "فوز 100000 متابع"
            }
        };
        
        // 反向映射（用于概率统计）
        const reversePrizeMap = {
            "Win 100 Fans": "获得100粉丝",
            "Win 1000 Fans": "获得1000粉丝",
            "Win 5000 Fans": "获得5000粉丝",
            "Win 10000 Fans": "获得10000粉丝",
            "Win 100000 Fans": "获得100000粉丝",
            "فوز 100 متابع": "获得100粉丝",
            "فوز 1000 متابع": "获得1000粉丝",
            "فوز 5000 متابع": "获得5000粉丝",
            "فوز 10000 متابع": "获得10000粉丝",
            "فوز 100000 متابع": "获得100000粉丝"
        };
        
        // 初始化奖品映射（随机分配，仅用于洗牌展示）
        let gridPrizeMap = {};
        initPrizeMap();

        // ========== 语言切换功能 ==========
        function switchLanguage(lang) {
            if (lang === currentLang) return;
            
            currentLang = lang;
            
            // 更新按钮样式
            cnBtn.classList.toggle('active', lang === 'cn');
            enBtn.classList.toggle('active', lang === 'en');
            arBtn.classList.toggle('active', lang === 'ar');
            
            // 更新页面文本
            mainTitle.textContent = langConfig[lang].title;
            
            // 更新按钮文本（根据当前模式）
            if (isShuffleMode) {
                startBtn.textContent = langConfig[lang].shuffleBtn;
            } else {
                startBtn.textContent = langConfig[lang].startBtn;
            }
            
            // 更新所有格子的问号
            document.querySelectorAll('.grid-item').forEach(item => {
                if (item.innerHTML.includes('？') || item.innerHTML.includes('?') || item.innerHTML.includes('؟')) {
                    item.innerHTML = langConfig[lang].unknown;
                }
            });
            
            // 更新页面标题
            if (lang === 'cn') {
                document.title = '试试你的运气 | 幸运大抽奖';
            } else if (lang === 'en') {
                document.title = 'Try Your Luck | Lucky Draw';
            } else if (lang === 'ar') {
                document.title = 'جرب حظك | السحب الحظي';
            }
        }
        
        // 绑定语言切换事件
        cnBtn.addEventListener('click', () => switchLanguage('cn'));
        enBtn.addEventListener('click', () => switchLanguage('en'));
        arBtn.addEventListener('click', () => switchLanguage('ar'));

        // ========== 初始化奖品映射（随机分配，仅用于洗牌展示） ==========
        function initPrizeMap() {
            // 复制奖品配置并打乱顺序
            const shuffledPrizes = [...prizeConfig].sort(() => Math.random() - 0.5);
            // 分配给16个格子
            for (let i = 1; i <= 16; i++) {
                gridPrizeMap[i] = shuffledPrizes[i - 1];
            }
        }

        // ========== 概率抽奖核心函数 ==========
        function getPrizeByProbability() {
            // 创建概率池
            const prizePool = [];
            Object.entries(PRIZE_PROBABILITY).forEach(([prize, probability]) => {
                // 根据概率百分比添加对应数量的奖品到池中
                for (let i = 0; i < probability; i++) {
                    prizePool.push(prize);
                }
            });
            
            // 随机抽取一个奖品
            const randomIndex = Math.floor(Math.random() * prizePool.length);
            let prize = prizePool[randomIndex];
            
            // 根据当前语言转换奖品名称
            prize = prizeMap[currentLang][prize] || prize;
            
            return prize;
        }

        // ========== 工具方法 ==========
        function getItemByNum(num) {
            return document.querySelector(`.grid-item[data-num="${num}"]`);
        }

        function flashElement(targetItem, times, interval) {
            return new Promise(resolve => {
                let flashCount = 0;
                const flashTimer = setInterval(() => {
                    targetItem.style.animation = flashCount % 2 === 0 
                        ? 'flashOnce 0.15s ease-out forwards'
                        : 'none';
                    flashCount++;
                    if (flashCount >= times * 2) {
                        clearInterval(flashTimer);
                        targetItem.style.animation = 'none';
                        resolve();
                    }
                }, interval);
            });
        }

        // 获取奖品对应的颜色类名
        function getPrizeColorClass(prize) {
            // 统一转换为中文判断
            let prizeCn = reversePrizeMap[prize] || prize;
            
            switch(prizeCn) {
                case '获得100粉丝': return 'color-black';
                case '获得1000粉丝': return 'color-yellow';
                case '获得5000粉丝': return 'color-orange';
                case '获得10000粉丝': return 'color-blue';
                case '获得100000粉丝': return 'color-red';
                default: return 'color-black';
            }
        }
        
        // 生成奖品HTML（移除序号）
        function generatePrizeHtml(prize) {
            let prizeTop = langConfig[currentLang].prizeTop;
            let prizeBottom = '';
            
            // 根据奖品类型设置底部文本
            if (currentLang === 'cn') {
                switch(prize) {
                    case '获得100粉丝': prizeBottom = langConfig[currentLang].prize100Bottom; break;
                    case '获得1000粉丝': prizeBottom = langConfig[currentLang].prize1000Bottom; break;
                    case '获得5000粉丝': prizeBottom = langConfig[currentLang].prize5000Bottom; break;
                    case '获得10000粉丝': prizeBottom = langConfig[currentLang].prize10000Bottom; break;
                    case '获得100000粉丝': prizeBottom = langConfig[currentLang].prize100000Bottom; break;
                }
            } else if (currentLang === 'en') {
                switch(prize) {
                    case 'Win 100 Fans': prizeBottom = langConfig[currentLang].prize100Bottom; break;
                    case 'Win 1000 Fans': prizeBottom = langConfig[currentLang].prize1000Bottom; break;
                    case 'Win 5000 Fans': prizeBottom = langConfig[currentLang].prize5000Bottom; break;
                    case 'Win 10000 Fans': prizeBottom = langConfig[currentLang].prize10000Bottom; break;
                    case 'Win 100000 Fans': prizeBottom = langConfig[currentLang].prize100000Bottom; break;
                }
            } else if (currentLang === 'ar') {
                switch(prize) {
                    case 'فوز 100 متابع': prizeBottom = langConfig[currentLang].prize100Bottom; break;
                    case 'فوز 1000 متابع': prizeBottom = langConfig[currentLang].prize1000Bottom; break;
                    case 'فوز 5000 متابع': prizeBottom = langConfig[currentLang].prize5000Bottom; break;
                    case 'فوز 10000 متابع': prizeBottom = langConfig[currentLang].prize10000Bottom; break;
                    case 'فوز 100000 متابع': prizeBottom = langConfig[currentLang].prize100000Bottom; break;
                }
            }
            
            return `
                <div class="prize-text">
                    <span class="prize-top">${prizeTop}</span>
                    <span class="prize-bottom">${prizeBottom}</span>
                </div>
            `;
        }

        // ========== 洗牌功能核心逻辑 ==========
        async function shufflePrizes() {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;

            // 1. 重置所有格子样式
            document.querySelectorAll('.grid-item').forEach(item => {
                item.classList.remove('active', 'win', 'flipped', 'color-black', 'color-yellow', 'color-orange', 'color-blue', 'color-red');
                item.style.animation = 'none';
            });

            // 2. 逐个翻开格子展示奖品（模拟翻牌动画）
            const gridItems = document.querySelectorAll('.grid-item');
            for (let i = 0; i < gridItems.length; i++) {
                const item = gridItems[i];
                const num = item.dataset.num;
                let prize = gridPrizeMap[num];
                
                // 根据当前语言转换奖品名称
                prize = prizeMap[currentLang][prize] || prize;
                
                const colorClass = getPrizeColorClass(prize);
                
                // 添加洗牌展示样式和颜色类
                item.classList.add('shuffle-show', colorClass);
                // 生成奖品文字（移除序号）
                item.innerHTML = generatePrizeHtml(prize);
                
                // 每个格子翻牌间隔
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            // 3. 展示指定时长后翻回问号面
            await new Promise(resolve => setTimeout(resolve, SHOW_PRIZE_TIME));
            
            // 4. 逐个翻回红色底问号面
            for (let i = gridItems.length - 1; i >= 0; i--) {
                const item = gridItems[i];
                item.classList.remove('shuffle-show', 'color-black', 'color-yellow', 'color-orange', 'color-blue', 'color-red');
                item.innerHTML = langConfig[currentLang].unknown;
                await new Promise(resolve => setTimeout(resolve, 80));
            }

            // 5. 重新随机分配奖品（仅用于洗牌展示）
            initPrizeMap();

            // 6. 恢复按钮状态
            isShuffleMode = false;
            startBtn.textContent = langConfig[currentLang].startBtn;
            isRunning = false;
            startBtn.disabled = false;
        }

        // ========== 核心抽奖逻辑（精确概率控制） ==========
        startBtn.addEventListener('click', async () => {
            // 如果是洗牌模式，执行洗牌
            if (isShuffleMode) {
                shufflePrizes();
                return;
            }

            // 正常抽奖逻辑
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;

            // 重置所有格子样式
            document.querySelectorAll('.grid-item').forEach(item => {
                item.classList.remove('active', 'win', 'flipped', 'shuffle-show', 'color-black', 'color-yellow', 'color-orange', 'color-blue', 'color-red');
                item.style.animation = 'none';
                item.innerHTML = langConfig[currentLang].unknown;
            });

            // 随机滚动时长（1000-1300ms）
            const totalTime = 1000 + Math.floor(Math.random() * 301);
            const startTime = Date.now();
            let pathIndex = 0;
            let speed = 10; // 初始滚动速度

            function run() {
                const now = Date.now();
                const passTime = now - startTime;
                const progress = passTime / totalTime;

                // 移除上一个格子的高亮
                getItemByNum(luckyPath[pathIndex])?.classList.remove('active');
                // 移动到轨迹下一个格子
                pathIndex = (pathIndex + 1) % luckyPath.length;
                const currNum = luckyPath[pathIndex];
                const currItem = getItemByNum(currNum);
                // 添加当前格子的高亮
                currItem?.classList.add('active');

                // 滚动速度随进度变慢
                speed = 10 + progress * 110;

                // 滚动结束开奖
                if (passTime >= totalTime) {
                    document.querySelectorAll('.grid-item').forEach(item => item.classList.remove('active'));
                    currItem.classList.add('win');
                    
                    // 关键修改：使用概率函数获取中奖奖品
                    const winPrize = getPrizeByProbability();
                    
                    // 闪烁动画后翻转显示奖品
                    flashElement(currItem, FLASH_TIMES, FLASH_INTERVAL).then(() => {
                        currItem.classList.remove('win');
                        currItem.classList.add('flipped');
                        // 获取奖品颜色类
                        const colorClass = getPrizeColorClass(winPrize);
                        currItem.classList.add(colorClass);
                        // 生成奖品文字（移除序号）
                        currItem.innerHTML = generatePrizeHtml(winPrize);
                        
                        // 切换为洗牌模式
                        isShuffleMode = true;
                        startBtn.textContent = langConfig[currentLang].shuffleBtn;
                        
                        // 解锁状态
                        isRunning = false;
                        startBtn.disabled = false;
                    });
                    return;
                }
                // 继续滚动
                setTimeout(() => requestAnimationFrame(run), speed);
            }
            // 启动滚动
            run();
        });

        // ========== 调试快捷入口 ==========
        window.clearRecord = function() {
            alert(langConfig[currentLang].clearRecordAlert);
        }

        // ========== 概率验证工具（更新为验证自定义概率） ==========
        window.checkProbability = function(times = 10000) {
            const result = {
                "获得100粉丝": 0,
                "获得1000粉丝": 0,
                "获得5000粉丝": 0,
                "获得10000粉丝": 0,
                "获得100000粉丝": 0
            };
            
            for(let i=0; i<times; i++) {
                let prize = getPrizeByProbability();
                // 统一转换为中文统计
                prize = reversePrizeMap[prize] || prize;
                result[prize]++;
            }
            
            console.log(`${langConfig[currentLang].checkProbabilityLog1}${times}${langConfig[currentLang].checkProbabilityLog2}`);
            console.log(`100${langConfig[currentLang].checkProbabilityLog3}${result["获得100粉丝"]}${langConfig[currentLang].checkProbabilityLog4}${(result["获得100粉丝"]/times*100).toFixed(2)}%)`);
            console.log(`1000${langConfig[currentLang].checkProbabilityLog3}${result["获得1000粉丝"]}${langConfig[currentLang].checkProbabilityLog4}${(result["获得1000粉丝"]/times*100).toFixed(2)}%)`);
            console.log(`5000${langConfig[currentLang].checkProbabilityLog3}${result["获得5000粉丝"]}${langConfig[currentLang].checkProbabilityLog4}${(result["获得5000粉丝"]/times*100).toFixed(2)}%)`);
            console.log(`10000${langConfig[currentLang].checkProbabilityLog3}${result["获得10000粉丝"]}${langConfig[currentLang].checkProbabilityLog4}${(result["获得10000粉丝"]/times*100).toFixed(2)}%)`);
            console.log(`100000${langConfig[currentLang].checkProbabilityLog3}${result["获得100000粉丝"]}${langConfig[currentLang].checkProbabilityLog4}${(result["获得100000粉丝"]/times*100).toFixed(2)}%)`);
            alert(langConfig[currentLang].checkProbabilityAlert);
        }
    </script>
</body>
